[project]
name = "hkex-bilingual-downloader"
version = "0.1.0"
description = "Find, pair and download English and Traditional Chinese HKEXnews announcements"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pathvalidate==3.3.1",
    "pydantic==2.14.2",
    "pypdf==6.21.4",
    "tzdata==2026.6",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis==6.170.13",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pyyaml==6.0.3",
    "respx==0.23.1",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = ["live: calls the real HKEXnews site (opt-in, run with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests carry real HKEX titles and deliberate full-width characters.
"tests/**" = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
